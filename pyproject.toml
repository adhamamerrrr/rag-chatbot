[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "portfolio-rag"
version = "0.1.0"
requires-python = ">=3.10"
[project.scripts]
rag-chat = "portfolio_rag.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
